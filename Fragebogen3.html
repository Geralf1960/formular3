<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Digitaler Fragebogen</title>
</head>
<body>
  <div id="question-container">
    <p id="question-text"></p>
    <div>
      <button onclick="answer(true)">Ja</button>
      <button onclick="answer(false)">Nein</button>
    </div>
    <div id="upload" style="display:none; margin-top:20px;">
      <p>Bitte laden Sie Ihre Datei hoch:</p>
      <a id="upload-link" href="#" target="_blank">Upload starten</a><br><br>
      <button onclick="nextQuestion()">Weiter</button>
    </div>
  </div>

  <!-- EmailJS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
  <!-- SheetJS SDK zum Lesen der Excel-Datei -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <script>
  (function(){
      // Deinen EmailJS Public Key eintragen (Account → Integration → Public Key)
      emailjs.init("ueUbQfFPpdM5MC2z2");
  })();

  let answers = [];
  let currentQuestion = 0;
  let questions = [
    "Frage 1: Haben Sie Unterlagen, die hochgeladen werden müssen?",
    "Frage 2: Enthält Ihr Antrag zusätzliche Nachweise?",
    "Frage 3: Liegt eine beglaubigte Kopie vor?",
    "Frage 4: Müssen Sie ein Foto hochladen?",
    "Frage 5: Haben Sie eine Vollmacht beizufügen?",
    "Frage 6: Benötigen wir Ihre Unterschrift als Datei?",
    "Frage 7: Enthält Ihre Meldung technische Zeichnungen?",
    "Frage 8: Haben Sie einen Zahlungsbeleg?",
    "Frage 9: Muss ein Ausweisdokument hochgeladen werden?",
    "Frage 10: Möchten Sie sonstige Dokumente hochladen?"
  ];

  let uploadLinkBase = "";
  let userEmail = "";
  let excelData = {};

  function getQueryParam(param) {
    const urlParams = new URLSearchParams(window.location.search);
    return urlParams.get(param);
  }

  async function loadExcel() {
    // ⚠️ Pfad anpassen: Datei muss im Repo liegen
    const excelUrl = "https://raw.githubusercontent.com/Geralf1960/formular3/main/Empfaenger-Upload-Links-2.xlsx";

    let response = await fetch(excelUrl);
    if (!response.ok) {
      throw new Error("Netzwerkfehler beim Laden der Excel-Datei: " + response.status);
    }

    let arrayBuffer = await response.arrayBuffer();
    let workbook = XLSX.read(arrayBuffer, { type: "array" });

    let sheetName = workbook.SheetNames[0];
    let sheet = workbook.Sheets[sheetName];
    let json = XLSX.utils.sheet_to_json(sheet, { header: 1 });

    excelData = {};
    // Annahme: Spalte A = Email, Spalte B = UploadLink
    json.slice(1).forEach(row => {
      if (row[0] && row[1]) {
        excelData[row[0].trim().toLowerCase()] = row[1].trim();
      }
    });
  }

  async function startForm() {
    try {
      await loadExcel();
    } catch (e) {
      document.getElementById("question-container").innerHTML =
        "<p style='color:red'>Fehler beim Laden der Excel-Datei: " + e.message + "</p>";
      return;
    }

    userEmail = getQueryParam("user");
    if (!userEmail) {
      document.getElementById("question-container").innerHTML =
        "<p style='color:red'>Fehler: Keine E-Mail-Adresse in der URL gefunden.</p>";
      return;
    }

    if (!excelData[userEmail.toLowerCase()]) {
      document.getElementById("question-container").innerHTML =
        `<p style='color:red'>Kein Upload-Link für ${userEmail} gefunden.</p>`;
      return;
    }

    uploadLinkBase = excelData[userEmail.toLowerCase()];
    showQuestion();
  }

  function showQuestion() {
    if (currentQuestion >= questions.length) {
      document.getElementById("question-container").innerHTML = `
        <h3>Vielen Dank!</h3>
        <p>Ihre Antworten werden jetzt gesendet...</p>
      `;
      sendAnswers();
      return;
    }
    document.getElementById("question-text").innerText = questions[currentQuestion];
    document.getElementById("upload").style.display = "none";
  }

  function answer(val) {
    answers.push(`Frage ${currentQuestion+1}: ${val ? 'Ja' : 'Nein'}`);
    if (val) {
      let linkWithEmail = uploadLinkBase.includes("?")
        ? `${uploadLinkBase}&email=${encodeURIComponent(userEmail)}`
        : `${uploadLinkBase}?email=${encodeURIComponent(userEmail)}`;

      document.getElementById("upload-link").href = linkWithEmail;
      document.getElementById("upload").style.display = "block";
    } else {
      currentQuestion++;
      showQuestion();
    }
  }

  function nextQuestion() {
    document.getElementById("upload").style.display = "none";
    currentQuestion++;
    showQuestion();
  }

  function sendAnswers() {
    let answerText = answers.join("\n");
    emailjs.send("service_b074ymd", "template_omwd93k", {
        from_email: userEmail,
        answers: answerText
    }).then(function() {
        document.getElementById("question-container").innerHTML +=
          "<p>Antworten wurden erfolgreich gesendet.</p>";
    }, function(err) {
        document.getElementById("question-container").innerHTML +=
          "<p style='color:red'>Fehler beim Senden: " + JSON.stringify(err) + "</p>";
    });
  }

  window.onload = startForm;
  </script>
</body>
</html>
